name: build

# Started by hand. Each run builds FFmpeg from the pinned, signature-checked
# source tarball and publishes one release holding the zip, its SHA-256, that
# source tarball and the build log.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            make
            diffutils
            curl
            tar
            xz
            zip

      - name: Build
        shell: msys2 {0}
        run: bash ./build.sh

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "n9.0.2-mo.${{ github.run_number }}"
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'release-notes.md' } | ForEach-Object { $_.FullName }
          gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "FFmpeg 9.0.2, LGPL, build ${{ github.run_number }}" `
            --notes-file dist/release-notes.md @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the log when the build fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: dist/build.log
          if-no-files-found: ignore
